<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Firestop · Equipo</title>
<meta name="description" content="Planos y fotos compartidos de las obras de firestop" />
<meta name="theme-color" content="#101418" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-192.png" />
<style>
  :root {
    --bg: #101418;
    --panel: #1a2029;
    --panel-2: #222a35;
    --text: #eef1f5;
    --text-dim: #9aa6b2;
    --accent: #d81e2c;
    --ok: #3ea36b;
    --warn: #e0a400;
    --border: #2a3340;
    --radius: 12px;
    --topbar-bg: rgba(16, 20, 24, 0.94);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #eceff2;
    --text: #1a2029;
    --text-dim: #5b6572;
    --border: #dde2e7;
    --ok: #2f8c56;
    --warn: #a87a00;
    --topbar-bg: rgba(244, 245, 247, 0.94);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: var(--topbar-bg); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .brand small { font-weight: 600; color: var(--text-dim); letter-spacing: 0; }
  .spacer { flex: 1; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: #ff8a80; }
  :root[data-theme="light"] .btn.danger { color: #b3202b; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .iconbtn { width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  select.btn { padding-right: 10px; }

  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
  .input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 15px; color: var(--text);
  }
  textarea.input { min-height: 70px; resize: vertical; }
  .input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 0; }

  /* auth */
  .auth-wrap { max-width: 400px; margin: 8vh auto 40px; padding: 0 16px; }
  .auth-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .auth-card h1 { font-size: 22px; margin: 0 0 4px; }
  .auth-card p.lead { color: var(--text-dim); margin: 0 0 18px; }
  .auth-switch { margin-top: 14px; text-align: center; color: var(--text-dim); font-size: 13px; }
  .linkbtn { background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .msg.err { background: color-mix(in srgb, var(--accent) 16%, transparent); color: #ff9c94; }
  :root[data-theme="light"] .msg.err { color: #a3141f; }
  .msg.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); }

  /* layout */
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 57px); }
  .side { border-right: 1px solid var(--border); padding: 16px 12px; }
  .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin: 0 6px 10px; }
  .obra-item {
    display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
    border-radius: 10px; padding: 10px; cursor: pointer; margin-bottom: 4px;
  }
  .obra-item:hover { background: var(--panel); }
  .obra-item[aria-current="true"] { background: var(--panel); border-color: var(--border); box-shadow: inset 3px 0 0 var(--accent); }
  .obra-item strong { display: block; font-size: 14.5px; }
  .obra-item small { color: var(--text-dim); }
  .main { padding: 20px 24px 60px; min-width: 0; }
  .main-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .main-head h1 { margin: 0; font-size: 24px; }
  .main-head .sub { color: var(--text-dim); margin-top: 2px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab .n { opacity: .75; font-weight: 500; margin-left: 4px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters .input { width: auto; flex: 1; min-width: 180px; padding: 8px 12px; font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .thumb { aspect-ratio: 4/3; background: var(--panel-2); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .doc { font-weight: 800; font-size: 13px; letter-spacing: .08em; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .thumb .doc svg { width: 42px; height: 42px; }
  .badge {
    position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff;
  }
  .badge.plano { background: var(--accent); }
  .card .body { padding: 10px 12px 12px; }
  .card .title { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); }

  .empty { text-align: center; color: var(--text-dim); padding: 50px 20px; border: 1px dashed var(--border); border-radius: 14px; }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* dialogs */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; padding: 20px; }
  .dialog h2 { margin: 0 0 14px; font-size: 19px; }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button { flex: 1; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 22px; text-align: center; color: var(--text-dim); cursor: pointer; margin-bottom: 12px; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop strong { color: var(--text); }

  .viewer { position: fixed; inset: 0; z-index: 60; background: rgba(5,7,9,.94); display: flex; flex-direction: column; }
  .viewer-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #eef1f5; border-bottom: 1px solid rgba(255,255,255,.12); }
  .viewer-head .t { flex: 1; min-width: 0; }
  .viewer-head .t strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-head .t small { color: #9aa6b2; }
  .viewer-head .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: #fff; }
  .viewer-body { flex: 1; display: flex; min-height: 0; }
  .viewer-media { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; padding: 12px; }
  .viewer-media img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  .viewer-media iframe { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 6px; }
  .viewer-info { width: 300px; border-left: 1px solid rgba(255,255,255,.12); padding: 16px; color: #d5dbe2; overflow: auto; }
  .viewer-info dt { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: #8b97a3; margin-top: 12px; }
  .viewer-info dd { margin: 3px 0 0; white-space: pre-wrap; }

  .member { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .member:last-child { border-bottom: 0; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex: none; }
  .member .who { flex: 1; min-width: 0; }
  .member .who strong { display: block; overflow: hidden; text-overflow: ellipsis; }
  .member .who small { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; display: block; }
  .pill { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); color: var(--text-dim); }
  .pill.admin { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 999px; z-index: 80; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .progress { height: 4px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

  .menu-mobile { display: none; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .side { display: none; border-right: 0; border-bottom: 1px solid var(--border); }
    .side.open { display: block; }
    .menu-mobile { display: inline-flex; }
    .main { padding: 16px 16px 60px; }
    .brand small { display: none; }
    .viewer-body { flex-direction: column; }
    .viewer-info { width: auto; border-left: 0; border-top: 1px solid rgba(255,255,255,.12); max-height: 34vh; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <button class="btn iconbtn menu-mobile" id="menuBtn" aria-label="Obras" hidden>&#9776;</button>
    <div class="brand"><img src="../icons/icon-192.png" alt=""> Firestop <small data-t="brand_sub"></small></div>
    <div class="spacer"></div>
    <select class="btn sm" id="langSel" aria-label="Language">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
    <button class="btn iconbtn" id="themeBtn" aria-label="Theme">&#9728;</button>
    <button class="btn sm" id="userBtn" hidden></button>
  </header>

  <!-- Login / signup -->
  <section id="authView" class="auth-wrap" hidden>
    <div class="auth-card">
      <h1 id="authTitle"></h1>
      <p class="lead" id="authLead"></p>
      <div id="authMsg"></div>
      <form id="authForm" autocomplete="on">
        <label class="field" id="nameField" hidden><span data-t="f_name"></span><input class="input" id="authName" autocomplete="name"></label>
        <label class="field"><span data-t="f_email"></span><input class="input" id="authEmail" type="email" required autocomplete="email"></label>
        <label class="field"><span data-t="f_password"></span><input class="input" id="authPass" type="password" required minlength="8" autocomplete="current-password"></label>
        <button class="btn primary" style="width:100%;padding:12px" id="authSubmit" type="submit"></button>
      </form>
      <div class="auth-switch"><span id="authSwitchText"></span> <button class="linkbtn" id="authSwitch" type="button"></button></div>
    </div>
  </section>

  <!-- App -->
  <div id="appView" class="layout" hidden>
    <aside class="side" id="side">
      <h2 data-t="obras"></h2>
      <div id="obraList"></div>
      <button class="btn sm" style="margin:10px 6px 0" id="newObraBtn" data-t="new_obra"></button>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <script src="../vendor/supabase.js"></script>
  <script src="../team.js"></script>
  <script src="equipo.js"></script>
</body>
</html>
